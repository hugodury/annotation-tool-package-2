services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      FLASK_HOST: 0.0.0.0
      MODELS_DOWNLOAD_URL: ${MODELS_DOWNLOAD_URL:-}
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
