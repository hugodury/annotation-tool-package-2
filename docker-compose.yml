services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 30s

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      OLLAMA_HOST: http://ollama:11434
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      MODELS_DOWNLOAD_URL: ${MODELS_DOWNLOAD_URL:-}
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  ollama_data:
